name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package and publish extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          VERSION=$(node -p "require('./extensions/browser-bookmark/manifest.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${VERSION}. Bump manifest.json or use tag v${VERSION}."
            exit 1
          fi

      - name: Package extension zip
        run: |
          VERSION=$(node -p "require('./extensions/browser-bookmark/manifest.json').version")
          mkdir -p dist
          cd extensions/browser-bookmark
          zip -r "../../dist/star-nav-extension-v${VERSION}.zip" . -x '*.DS_Store'
          cd ../..
          echo "ASSET=dist/star-nav-extension-v${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./extensions/browser-bookmark/manifest.json').version")
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "StarNav 浏览器插件 v${VERSION}" \
            --notes "MV3 插件 zip：下载后解压，打开 chrome://extensions → 开启开发者模式 → 「加载已解压的扩展程序」选择解压目录。
配置：插件设置页填写 StarNav 地址与 Bearer Token（后台 Token 管理创建，需 write scope）。"
