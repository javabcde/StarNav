<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>收藏到 StarNav</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --star: #b45309;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --card: #0f172a;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --border: #1e293b;
        --primary: #60a5fa;
        --star: #f5c26b;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 420px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      padding: 16px;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
    }

    #openSiteBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 4px;
      background: transparent;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    #openSiteBtn:hover {
      background: var(--border);
      color: var(--text);
    }

    #openSiteBtn svg {
      width: 100%;
      height: 100%;
    }

    #optionsBtn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 36px;
      height: 36px;
      padding: 7px;
      background: transparent;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    #optionsBtn:hover {
      background: var(--border);
      color: var(--text);
    }

    #optionsBtn svg {
      width: 100%;
      height: 100%;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--card);
      font: inherit;
    }

    textarea {
      min-height: 62px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 30%, transparent);
    }

    button.primary:hover {
      filter: brightness(1.08);
    }

    button {
      padding: 9px 10px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--primary);
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
    }

    button.danger {
      background: var(--danger);
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    #status,
    #duplicateBox {
      min-height: 22px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    #duplicateBox {
      display: none;
      padding: 10px;
      border: 1px solid color-mix(in srgb, var(--warning) 40%, var(--border));
      border-radius: 12px;
      color: var(--warning);
      background: color-mix(in srgb, var(--warning) 10%, transparent);
    }

    .sync-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .sync-section button {
      width: 100%;
    }

    #syncResult {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--text);
      background: var(--card);
    }

    .input-action {
      position: relative;
      display: block;
    }

    .input-action input {
      padding-right: 46px;
    }

    .input-action button {
      position: absolute;
      right: 5px;
      top: 50%;
      width: 34px;
      height: 34px;
      min-width: 34px;
      padding: 0;
      transform: translateY(-50%);
      border: 1px solid color-mix(in srgb, var(--primary) 25%, var(--border));
      border-radius: 11px;
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      line-height: 1;
      box-shadow: none;
    }

    .input-action button:hover {
      background: color-mix(in srgb, var(--primary) 18%, transparent);
      border-color: var(--primary);
      color: var(--primary);
    }

    .full {
      grid-column: 1 / -1;
    }

    .tiny {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    /* ===== 三 Tab ===== */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab {
      flex: 1;
      padding: 7px 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--card);
      font-size: 13px;
      font-weight: 800;
      transition: background .15s, color .15s, border-color .15s;
    }

    .tab:hover {
      color: var(--text);
      border-color: var(--primary);
    }

    .tab.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    /* ===== 浏览视图 ===== */
    .browse-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .browse-toolbar input {
      flex: 1;
      min-width: 0;
    }

    #browseSort {
      width: auto;
      flex-shrink: 0;
      padding: 9px 8px;
    }

    #browseRefresh {
      flex-shrink: 0;
      width: 40px;
      height: 38px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #browseRefresh svg {
      width: 18px;
      height: 18px;
    }

    .browse-cats {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 6px;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .cat-node {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .browse-cat-children {
      padding: 4px 0 8px;
      margin-bottom: 6px;
    }

    .browse-cat-group {
      margin-bottom: 8px;
    }

    .browse-cat-group:last-child {
      margin-bottom: 0;
    }

    .browse-cat-group-label {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 5px;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .02em;
    }

    .browse-cat-group-items {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }

    .browse-cat-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .browse-cat {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--card);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .browse-cat:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .browse-cat-child {
      opacity: .85;
      font-size: 12px;
    }

    .cat-folder-icon {
      width: 12px;
      height: 12px;
      margin-right: 5px;
      vertical-align: -1px;
      color: var(--muted);
    }

    .browse-cat.active .cat-folder-icon {
      color: #fff;
    }

    .browse-cat-toggle {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted, #64748b);
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
    }

    .browse-cat-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .browse-cat.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .browse-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: 12px;
      background: var(--card);
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .12s;
    }

    .browse-item + .browse-item {
      margin-top: 8px;
    }

    .browse-item:hover {
      background: color-mix(in srgb, var(--primary) 8%, var(--card));
      border-left-color: var(--star);
      transform: translateX(2px);
    }

    .browse-item.jumping {
      animation: browseJump .45s ease-out;
    }

    @keyframes browseJump {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--star) 55%, transparent); background: var(--card); }
      55% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--star) 14%, transparent); background: color-mix(in srgb, var(--star) 13%, var(--card)); }
      100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--star) 0%, transparent); background: var(--card); }
    }

    .browse-item-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform .12s;
    }

    .browse-item:hover .browse-item-title {
      transform: translateX(2px);
    }

    .browse-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      min-width: 0;
    }

    .browse-chip {
      flex-shrink: 0;
      padding: 1px 7px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      color: var(--primary);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.5;
    }

    .browse-item-host {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .browse-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .browse-logo-placeholder {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      background:
        radial-gradient(circle at 68% 28%, color-mix(in srgb, var(--star-color) 60%, transparent), transparent 48%),
        linear-gradient(140deg, #1e293b, #0f172a);
    }

    .browse-logo-placeholder b {
      position: relative;
      z-index: 1;
    }

    .browse-logo-placeholder i {
      position: absolute;
      top: 3px;
      right: 4px;
      z-index: 1;
      font-style: normal;
      font-size: 9px;
      line-height: 1;
      color: var(--star);
    }

    .browse-item-body {
      flex: 1;
      min-width: 0;
    }

    .browse-item-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .browse-item-host {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #browseMore {
      width: 100%;
      margin-top: 10px;
    }

    #browseStatus {
      min-height: 22px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .browse-empty {
      padding: 28px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .browse-init-hint {
      padding: 14px 0 28px;
    }

    .browse-skeleton {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      animation: browsePulse 1.2s ease-in-out infinite;
    }

    .browse-skeleton .sk-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    .browse-skeleton .sk-line {
      flex: 1;
      height: 12px;
      border-radius: 6px;
      background: var(--border);
    }

    @keyframes browsePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="appTitle" style="display:flex;align-items:center;gap:4px;"><span id="appTitleText">收藏到 StarNav</span>
        <button id="openSiteBtn" title="打开主站" aria-label="打开主站">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.25 5.5a.75.75 0 00-.75.75v8.5c0 .414.336.75.75.75h8.5a.75.75 0 00.75-.75v-4a.75.75 0 011.5 0v4A2.25 2.25 0 0111.75 17h-7.5A2.25 2.25 0 012 14.75v-8.5A2.25 2.25 0 014.25 4h5a.75.75 0 010 1.5h-5z" clip-rule="evenodd"/>
            <path fill-rule="evenodd" d="M6.194 12.753a.75.75 0 001.06.053L16.5 4.44v2.81a.75.75 0 001.5 0v-4.5a.75.75 0 00-.75-.75h-4.5a.75.75 0 000 1.5h2.553l-9.056 8.194a.75.75 0 00-.053 1.06z" clip-rule="evenodd"/>
          </svg>
        </button>
      </h1>
      <button id="optionsBtn" title="设置">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path d="M5 4a1 1 0 00-2 0v7.268a2 2 0 000 3.464V16a1 1 0 102 0v-1.268a2 2 0 000-3.464V4zM11 4a1 1 0 10-2 0v1.268a2 2 0 000 3.464V16a1 1 0 102 0V8.732a2 2 0 000-3.464V4zM16 3a1 1 0 011 1v7.268a2 2 0 010 3.464V16a1 1 0 11-2 0v-1.268a2 2 0 010-3.464V4a1 1 0 011-1z" />
        </svg>
      </button>
    </header>

    <nav class="tabs">
      <button id="tabBrowse" type="button" class="tab active">浏览</button>
      <button id="tabCollect" type="button" class="tab">收藏</button>
      <button id="tabSync" type="button" class="tab">同步</button>
    </nav>

    <!-- 浏览视图：站内书签浏览 -->
    <section id="browse-view" class="view">
      <div class="browse-toolbar">
        <input id="browseSearch" placeholder="搜索站内书签..." autocomplete="off">
        <select id="browseSort" title="排序">
          <option value="">默认排序</option>
          <option value="hits">热门</option>
          <option value="last_visit">最近访问</option>
          <option value="name">名称</option>
        </select>
        <button id="browseRefresh" type="button" title="刷新" aria-label="刷新">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
          </svg>
        </button>
      </div>
      <div id="browseCats" class="browse-cats"></div>
      <div id="browseCatChildren" class="browse-cat-children" style="display:none;"></div>
      <div id="browseList" class="browse-list"></div>
      <button id="browseMore" type="button" class="secondary" style="display:none;">加载更多</button>
      <div id="browseStatus"></div>
    </section>

    <!-- 收藏视图：原有收藏表单 -->
    <section id="collect-view" class="view" hidden>
      <div class="search-container" style="margin-bottom: 12px; border-bottom: 1px dashed var(--border); padding-bottom: 12px;">
        <input id="pluginSearchInput" placeholder="🔍 搜索已有书签..." style="padding: 7px 10px; font-size: 13px;">
        <div id="pluginSearchResults" style="display: none; max-height: 150px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 4px;"></div>
      </div>

      <label for="name">名称</label>
      <input id="name">

      <label for="url">URL</label>
      <input id="url">

      <label for="desc">描述</label>
      <textarea id="desc" placeholder="可选，自动抓取后会填充"></textarea>

      <div class="row">
        <div>
          <label for="catelog">分类</label>
          <input id="catelog" placeholder="未分类" list="categoryList">
        </div>
        <div>
          <label for="tags">标签</label>
          <input id="tags" placeholder="逗号分隔" list="tagList">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="visibility">可见性</label>
          <select id="visibility">
            <option value="public">公开</option>
            <option value="private">私密</option>
            <option value="unlisted">不列出</option>
            <option value="admin_only">仅管理员</option>
          </select>
        </div>
        <div>
          <label for="logo">Logo URL</label>
          <div class="input-action">
            <input id="logo" placeholder="自动抓取">
            <button id="fetchFaviconBtn" type="button" title="自动获取图标" aria-label="自动获取图标">✨</button>
          </div>
        </div>
      </div>

      <datalist id="categoryList"></datalist>
      <datalist id="tagList"></datalist>

      <div id="duplicateBox"></div>

      <div class="actions">
        <button id="saveBtn" class="primary full">保存书签</button>
        <button id="fetchBtn" class="secondary">自动抓取</button>
        <button id="checkDuplicateBtn" class="secondary">检测重复</button>
        <button id="suggestCategoryBtn" class="secondary">推荐分类</button>
        <button id="suggestTagsBtn" class="secondary">推荐标签</button>
        <button id="forceSaveBtn" class="danger full" style="display:none;">仍然强制保存</button>
      </div>
    </section>

    <!-- 同步视图：原有一键同步 -->
    <section id="sync-view" class="view" hidden>
      <div class="sync-section">
        <div class="sync-hint" id="syncHint">把浏览器收藏夹里的书签同步到 StarNav 网站，以浏览器为基准；网站上的手动书签不会被覆盖。</div>
        <button id="syncBtn" class="primary full">将浏览器书签同步到网站</button>
        <div id="syncResult"></div>
      </div>
    </section>

    <div id="status"></div>
    <div class="tiny">生产版支持站内浏览、Bearer Token、自动抓取、AI 推荐、重复检测、分类/标签候选、强制保存和一键同步。</div>
  </main>

  <script src="extension-contract.js"></script>
  <script src="popup-logic.js"></script>
  <script src="popup.js"></script>
</body>
</html>
