<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择收藏分类</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #3b82f6;
      --primary-text: #ffffff;
      --danger: #ef4444;
      --danger-text: #ffffff;
      --star: #f59e0b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --muted: #94a3b8;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      width: 340px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    header h1 { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #closeBtn {
      border: none; background: none; color: var(--muted); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px;
    }
    #closeBtn:hover { background: var(--border); color: var(--text); }
    .candidate {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .candidate .c-name { font-weight: 600; font-size: 13px; word-break: break-all; }
    .candidate .c-url {
      font-size: 11px; color: var(--muted); margin-top: 2px;
      word-break: break-all; max-height: 32px; overflow: hidden;
    }
    .cats-wrap { flex: 1; overflow-y: auto; padding: 8px; }
    .cats-title { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .cat-row {
      display: block; width: 100%; text-align: left;
      border: 1px solid transparent; background: none; color: var(--text);
      padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .cat-row:hover { background: var(--border); }
    .cat-row.active {
      background: var(--primary); color: var(--primary-text); border-color: var(--primary);
    }
    .cat-row.level0 { font-weight: 600; }
    .cat-row.level1 { padding-left: 26px; font-weight: 400; }
    .cat-arrow { display: inline-block; width: 14px; color: var(--muted); }
    .cat-row.active .cat-arrow { color: var(--primary-text); }
    .cat-children { margin-left: 10px; border-left: 1px dashed var(--border); padding-left: 4px; }
    .cat-empty { padding: 12px; color: var(--muted); text-align: center; }
    .missing { padding: 24px 16px; text-align: center; color: var(--muted); flex: 1; }
    #duplicateBox {
      display: none; margin: 0 12px 8px; padding: 8px 10px;
      background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 10px; font-size: 12px; word-break: break-all;
    }
    footer {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1px solid var(--border); background: var(--card);
    }
    button.primary, button.danger {
      flex: 1; border: none; border-radius: 10px; padding: 9px 12px;
      font-size: 13px; font-weight: 600; cursor: pointer; color: var(--primary-text);
    }
    button.primary { background: var(--primary); }
    button.danger { background: var(--danger); color: var(--danger-text); }
    button.primary:disabled, button.danger:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { font-size: 11px; color: var(--muted); padding: 0 12px 8px; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">选择收藏分类</h1>
    <button id="closeBtn" title="关闭" aria-label="关闭">✕</button>
  </header>

  <section class="candidate">
    <div class="c-name" id="candidateName"></div>
    <div class="c-url" id="candidateUrl"></div>
  </section>

  <div class="cats-wrap">
    <div class="cats-title">保存到分类</div>
    <div id="categoryList"></div>
    <div id="categoryStatus" class="cat-empty hidden"></div>
  </div>

  <div id="duplicateBox"></div>

  <footer>
    <button id="saveBtn" type="button" class="primary" disabled>保存</button>
    <button id="forceSaveBtn" type="button" class="danger hidden">仍然保存</button>
  </footer>
  <div id="status"></div>

  <script src="extension-contract.js"></script>
  <script src="popup-logic.js"></script>
  <script src="collect-picker-logic.js"></script>
  <script src="collect-picker.js"></script>
</body>
</html>
